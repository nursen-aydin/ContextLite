<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurulum - ContextLite</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-layout {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            background-color: var(--bg-page);
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="brand-icon">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h1>ContextLite</h1>
                <p>İlk yönetici hesabını oluşturun. Bu işlem sadece bir kez yapılır.</p>
            </div>
            <form id="setup-form" class="form-stack">
                <div class="form-group">
                    <label for="setup-name">Adınız</label>
                    <input type="text" id="setup-name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="setup-email">E-posta Adresiniz</label>
                    <input type="email" id="setup-email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="setup-password">Parola</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="setup-password" required autocomplete="new-password">
                        <button type="button" class="btn-icon toggle-password" aria-label="Parolayı Göster/Gizle">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <span class="input-hint">En az 12 karakter, 1 büyük harf, 1 sayı, 1 özel karakter.</span>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="setup-submit">Yönetici Hesabını Oluştur</button>
            </form>
            <div id="setup-error" class="error-alert hidden" aria-live="polite"></div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const input = btn.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
                } else {
                    input.type = 'password';
                    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                }
            });
        });

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('setup-name').value;
            const email = document.getElementById('setup-email').value;
            const password = document.getElementById('setup-password').value;
            const errorMsg = document.getElementById('setup-error');
            const submitBtn = document.getElementById('setup-submit');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Oluşturuluyor...';
            
            try {
                const res = await fetch('/api/auth/setup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, password})
                });
                
                if (res.ok) {
                    errorMsg.classList.add('hidden');
                    window.location.href = '/login';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.detail || 'Kurulum başarısız.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Ağ hatası oluştu.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Yönetici Hesabını Oluştur';
            }
        });
    </script>
</body>
</html>
