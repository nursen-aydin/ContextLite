<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - ContextLite</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-layout {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            background-color: var(--bg-page);
            overflow-y: auto;
        }
        .auth-footer {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }
        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card" style="margin-top:auto; margin-bottom:auto;">
            <div style="margin-bottom: 24px; text-align: left;">
                <a href="/" style="color: var(--text-secondary); text-decoration: none; font-weight: 500; padding: 8px 0; display: inline-block;">&larr; Ana sayfaya dön</a>
            </div>
            <div class="auth-header">
                <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="brand-icon">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <h1>ContextLite</h1>
                </a>
                <p>Ücretsiz hesabınızı oluşturun.</p>
            </div>
            <form id="signup-form" class="form-stack">
                <div class="form-group">
                    <label for="signup-name">Adınız</label>
                    <input type="text" id="signup-name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signup-email">E-posta Adresiniz</label>
                    <input type="email" id="signup-email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Parola</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signup-password" required minlength="8" maxlength="64" autocomplete="new-password">
                        <button type="button" class="btn-icon toggle-password" aria-label="Parolayı Göster/Gizle">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <span class="input-hint">En az 8 karakter; güvenlik için 12 veya daha uzun bir parola önerilir.</span>
                </div>
                <div class="form-group">
                    <label for="signup-password-confirm">Parola Tekrar</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signup-password-confirm" required minlength="8" maxlength="64" autocomplete="new-password">
                        <button type="button" class="btn-icon toggle-password" aria-label="Parolayı Göster/Gizle">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div style="font-size: 13px; text-align: left;">
                    <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--text-secondary);">
                        <input type="checkbox" id="terms-check" required style="margin-top:3px;"> 
                        <span>Kullanım koşullarını ve gizlilik politikasını okudum, kabul ediyorum.</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Ücretsiz Hesap Oluştur</button>
            </form>
            
            <div id="signup-error" class="error-alert hidden" aria-live="polite"></div>
            
            <div class="auth-footer" id="auth-footer">
                Zaten hesabınız var mı? <a href="/login">Giriş yapın</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const input = btn.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
                } else {
                    input.type = 'password';
                    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                }
            });
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;
            const errorMsg = document.getElementById('signup-error');
            const submitBtn = document.getElementById('signup-submit');
            
            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Parolalar eşleşmiyor.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Oluşturuluyor...';
            
            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, password})
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = data.verification_required ? "/account/verify" : "/app";
                } else {
                    errorMsg.textContent = data.detail || 'Kayıt başarısız.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Ağ hatası oluştu.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ücretsiz Hesap Oluştur';
            }
        });
    </script>
</body>
</html>
